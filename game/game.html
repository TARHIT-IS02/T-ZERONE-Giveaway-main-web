<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clash Blade</title>
<link rel="stylesheet" href="game.css">
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<div id="menuScreen" class="screen">
  <div class="topbar">
    <div class="goldPill">🪙 <span id="menuGold">0</span></div>
    <div class="spacer"></div>
    <button id="btnMusic" class="iconBtn">🔊</button>
  </div>
  <div id="logoPlaceholder" class="logoPlaceholder"></div>
  <p class="tagline">All heroes 100% FREE • Endless Wave Survival</p>
  <div class="tabs">
    <button id="tabHeroes" class="tab active">👑 Heroes</button>
    <button id="tabTroops" class="tab">🗡️ Troops</button>
  </div>
  <div id="charGrid" class="charGrid"></div>
  <div id="charInfo" class="charInfo"></div>
  <div class="menuBtns">
    <button id="btnUpgrades" class="bigBtn purple">⬆ UPGRADES</button>
    <button id="btnBattle" class="bigBtn green">⚔ BATTLE!</button>
  </div>
</div>

<!-- ============ UPGRADE HUB ============ -->
<div id="upgradeScreen" class="screen hidden">
  <div class="topbar">
    <button id="btnBackUp" class="iconBtn">◀</button>
    <h2 class="screenTitle">Upgrade Hub</h2>
    <div class="goldPill">🪙 <span id="upGold">0</span></div>
  </div>
  <div class="tabs">
    <button id="upTabHero" class="tab active">👑 Hero Upgrades</button>
    <button id="upTabTroop" class="tab">🗡️ Troop Upgrades</button>
  </div>
  <div id="upList" class="upList"></div>
</div>

<!-- ============ GAME ============ -->
<div id="gameScreen" class="screen hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hudTop">
      <div class="hpWrap"><div id="hpFill"></div><span id="hpText"></span></div>
      <div class="pill" id="hudWave">Wave 1</div>
      <div class="pill" id="hudEnemies">👾 0</div>
      <div class="pill gold">🪙 <span id="hudGold">0</span></div>
      <button id="btnPause" class="iconBtn">⏸</button>
    </div>
    <div id="banner"></div>

    <div id="joyBase"><div id="joyKnob"></div></div>

    <div id="actionCluster">
      <button class="actBtn small" id="btnShield"><span class="icon">🛡️</span><div class="cd"></div></button>
      <button class="actBtn small" id="btnDash"><span class="icon">💨</span><div class="cd"></div></button>
      <button class="actBtn small" id="btnPower"><span class="icon" id="powerIcon">✨</span><div class="cd"></div></button>
      <button class="actBtn big" id="btnAttack"><span class="icon">⚔️</span><div class="cd"></div></button>
    </div>
  </div>
  <div id="hpVignette"></div>
  <div id="pauseOverlay" class="hidden">
    <h2>PAUSED</h2>
    <button id="btnResume" class="bigBtn green">▶ Resume</button>
    <button id="btnQuit" class="bigBtn red">🏠 Quit to Camp</button>
  </div>
</div>

<!-- ============ GAME OVER ============ -->
<div id="overScreen" class="screen hidden">
  <h1 class="logo small">DEFEATED!</h1>
  <div class="overStats">
    <div class="pill">Wave reached: <b id="overWave">1</b></div>
    <div class="pill">Best: <b id="overBest">1</b></div>
    <div class="pill gold">🪙 Gold earned: <b id="overGold">0</b></div>
  </div>
  <button id="btnToMenu" class="bigBtn green">🏠 Return to Camp</button>
</div>

<script src="game.js"></script>
</body>
</html>
